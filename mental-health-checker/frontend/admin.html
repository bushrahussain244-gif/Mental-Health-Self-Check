<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health Checker - Admin Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .stat-card h3 {
            color: #666;
            font-size: 0.9em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-card.good .value {
            color: #28a745;
        }

        .stat-card.medium .value {
            color: #ffc107;
        }

        .stat-card.high .value {
            color: #dc3545;
        }

        .results-section {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .results-section h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #667eea;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f5f5f5;
            color: #333;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #e0e0e0;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
            color: #666;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .badge.good {
            background: #d4edda;
            color: #155724;
        }

        .badge.medium {
            background: #fff3cd;
            color: #856404;
        }

        .badge.high {
            background: #f8d7da;
            color: #721c24;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 0.9em;
            }

            th, td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Admin Dashboard</h1>
            <p>Mental Health Checker Statistics</p>
        </div>

        <div id="errorMessage" class="error" style="display: none;"></div>

        <div class="action-buttons">
            <button class="btn btn-primary" onclick="loadDashboard()">🔄 Refresh Data</button>
            <button class="btn btn-secondary" onclick="goBackHome()">🏠 Back to Assessment</button>
        </div>

        <div id="loadingMessage" class="loading">
            Loading statistics...
        </div>

        <div id="statsContainer" style="display: none;">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Assessments</h3>
                    <div class="value" id="totalCount">0</div>
                </div>
                <div class="stat-card">
                    <h3>Average Score</h3>
                    <div class="value" id="averageScore">0</div>
                </div>
                <div class="stat-card good">
                    <h3>Good State</h3>
                    <div class="value" id="goodCount">0</div>
                </div>
                <div class="stat-card medium">
                    <h3>Mild Stress</h3>
                    <div class="value" id="mediumCount">0</div>
                </div>
                <div class="stat-card high">
                    <h3>High Concern</h3>
                    <div class="value" id="highCount">0</div>
                </div>
            </div>

            <div class="results-section">
                <h2>Recent Assessment Results</h2>
                <div id="resultsTable"></div>
            </div>
        </div>
    </div>

    <script>
        function loadDashboard() {
            const loadingMessage = document.getElementById('loadingMessage');
            const statsContainer = document.getElementById('statsContainer');
            const errorMessage = document.getElementById('errorMessage');

            loadingMessage.style.display = 'block';
            statsContainer.style.display = 'none';
            errorMessage.style.display = 'none';

            // Load statistics
            fetch('/api/statistics')
                .then(response => response.json())
                .then(data => {
                    updateStats(data);
                    loadingMessage.style.display = 'none';
                    statsContainer.style.display = 'block';
                })
                .catch(error => {
                    console.error('Error loading statistics:', error);
                    showError('Failed to load statistics. Make sure the backend is running.');
                    loadingMessage.style.display = 'none';
                });

            // Load results
            fetch('/api/results')
                .then(response => response.json())
                .then(data => {
                    displayResults(data);
                })
                .catch(error => {
                    console.error('Error loading results:', error);
                });
        }

        function updateStats(stats) {
            document.getElementById('totalCount').textContent = stats.total;
            document.getElementById('averageScore').textContent = stats.averageScore.toFixed(2);
            document.getElementById('goodCount').textContent = stats.goodState;
            document.getElementById('mediumCount').textContent = stats.mediumState;
            document.getElementById('highCount').textContent = stats.highState;
        }

        function displayResults(data) {
            const resultsTable = document.getElementById('resultsTable');
            resultsTable.innerHTML = '';

            if (!data.results || data.results.length === 0) {
                resultsTable.innerHTML = '<div class="no-data">No assessment results yet.</div>';
                return;
            }

            let html = '<table><thead><tr><th>Name</th><th>Score</th><th>State</th><th>Date</th></tr></thead><tbody>';

            data.results.forEach(result => {
                const date = new Date(result.timestamp).toLocaleString();
                html += `
                    <tr>
                        <td>${escapeHtml(result.name)}</td>
                        <td>${result.score}/7</td>
                        <td><span class="badge ${result.state}">${capitalizeFirst(result.state)}</span></td>
                        <td>${date}</td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            resultsTable.innerHTML = html;
        }

        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        function goBackHome() {
            window.location.href = '/';
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function capitalizeFirst(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        // Load dashboard on page load
        window.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
